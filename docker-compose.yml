version: '3.8'
services:
  service-a:
    build:
      context: ./service-a
    ports:
      - "8081:8081"
    environment:
      - OTEL_EXPORTER_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  service-b:
    build:
      context: ./service-b
    ports:
      - "8080:8080"
    environment:
      - WEATHER_API_KEY=your_weather_api_key
      - OTEL_EXPORTER_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
